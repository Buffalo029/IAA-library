<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>IAA Library - Institute of Accountancy Arusha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#fff;--card:#fff;--tx:#1b1b2f;--mut:#5a5a78;--pp:#ece4f6;--pp2:#d0c0e8;--bd:#7b1631;--ac:#16245b;--ln:#ddd3ec;--hd:#16245b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:16px;color-scheme:light}
:root[data-theme=dark]{--bg:#0e1330;--card:#171e47;--tx:#ecebf7;--mut:#b4b3d0;--pp:#252b60;--pp2:#3a4290;--bd:#b32a54;--ac:#d3c6f3;--ln:#2e3670;--hd:#0a0e26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:1rem/1.55 'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
h1,h2,h3{font-family:'Libre Baskerville',Georgia,serif;color:var(--ac);line-height:1.25;margin:.2em 0 .5em}
h1{font-size:1.8rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
a{color:var(--ac)}.mut{color:var(--mut)}
.hd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 14px;z-index:20;flex-wrap:wrap}
.hd .lg{background:#fff;border-radius:8px;padding:3px 6px;border:0;cursor:pointer;display:flex}.hd .lg img{height:34px;display:block}
.hd b{font-family:'Libre Baskerville',serif;font-size:1rem;margin-right:auto}
.hd form{flex:1 1 200px;max-width:380px;display:flex;order:3}
.hd input{border-radius:8px 0 0 8px;border:0}.hd form button{border-radius:0 8px 8px 0;background:var(--bd);color:#fff;border:0;padding:0 12px;cursor:pointer}
.ib{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 40px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.tile{background:var(--pp);border:0;border-bottom:4px solid var(--bd);border-radius:12px;padding:18px;text-align:left;color:var(--ac);font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:110px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}
.b{background:var(--bd);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.b2{background:var(--pp);color:var(--ac);border:1px solid var(--pp2)}.b.s{padding:5px 12px;font-size:.9rem}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--pp2);background:var(--card);color:var(--tx);border-radius:8px;font:inherit}
label{display:block;font-weight:600;margin:10px 0 4px}
:focus-visible{outline:3px solid #8a6fd1;outline-offset:2px}
.hero{display:grid;gap:24px;grid-template-columns:1fr 1fr;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
img.ph{width:100%;border-radius:14px;border:4px solid var(--pp);display:block}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--pp);color:var(--ac)}.badge.no{background:var(--bd);color:#fff}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln)}th{background:var(--pp);color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 150px}
.chips button{flex:0 0 auto;border-radius:99px;padding:7px 14px}.chips .on{background:var(--ac);color:var(--bg)}
.ch{display:inline-block;opacity:0;transform:translateY(.5em);animation:rise .5s forwards}@keyframes rise{to{opacity:1;transform:none}}
.cy{display:inline-block;color:var(--bd);font-weight:700;transition:opacity .4s}
.nomo .ch{animation:none;opacity:1;transform:none}.nomo *{transition:none!important}
@media(prefers-reduced-motion:reduce){.ch{animation:none;opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:50;max-width:90%;display:none}
dialog{border:1px solid var(--pp2);border-radius:14px;background:var(--card);color:var(--tx);max-width:420px;width:90%}
footer{border-top:4px solid var(--bd);background:var(--pp);color:var(--ac);padding:14px;text-align:center;font-size:.9rem}
.stat{font-family:'Libre Baskerville',serif;font-size:1.8rem;color:var(--bd)}
</style></head><body><div id="hdr"></div><main id="app" tabindex="-1"></main><footer>Institute of Accountancy Arusha Library, Arusha Campus, Njiro, Arusha, Tanzania</footer><div id="toast" role="status"></div>
<dialog id="set"></dialog>

function openSet(){const s=D.set,d=$('#set');H(d,`<h2>Settings</h2><label for="st">Appearance</label><select id="st" onchange="D.set.theme=this.value;save();theme();hdr()"><option value="light"${s.theme=='light'?' selected':''}>Light</option><option value="dark"${s.theme=='dark'?' selected':''}>Dark</option><option value="auto"${s.theme=='auto'?' selected':''}>Match my device</option></select><label for="sz">Text size</label><select id="sz" onchange="D.set.size=+this.value;save();theme()"><option value="14"${s.size==14?' selected':''}>Small</option><option value="16"${s.size==16?' selected':''}>Medium</option><option value="19"${s.size==19?' selected':''}>Large</option></select><label><input type="checkbox" style="width:auto" ${s.motion?'checked':''} onchange="D.set.motion=this.checked;save();theme()"> Animations</label><p class="row"><button class="b" onclick="$('#set').close()">Done</button>${D.cur?'<button class="b b2" onclick="out()">Sign out</button>':''}</p>`);d.showModal()}
function out(){$('#set').close();D.cur=null;save();go('welcome')}
function anim(t){return t.split(' ').map((w,j,a)=>'<span style="white-space:nowrap">'+[...w].map((c,i)=>`<span class="ch" style="animation-delay:${(j*8+i)*.04}s">${c}</span>`).join('')+'</span>').join(' ')}
let Q='',tab='',cyT;
function bookCard(b){const a=av(b);return`<div class="card"><h3>${b.t}</h3><div class="mut">${b.a} (${b.y})</div><p>Subject: ${b.s}<br>ISBN: ${b.i}<br>Class number: ${b.k} &middot; Shelf: ${b.l}</p><span class="badge${a?'':' no'}">${a?a+' of '+b.c+' available':'All copies on loan'}</span> <button class="b s" style="margin-left:8px" onclick="circ('b',null,${b.id})">${a?'Borrow':'Reserve'}</button></div>`}
const tiles=()=>[['home','Home','home'],['about','About library','info'],['opac','OPAC','search'],['digital','Digital library','book'],['services','Services','list'],['research','Research support','cap'],['facilities','Library facilities','bldg'],['news','News and events','cal'],['account','My account','user'],['contact','Contact us','phone'],...(can('admin','librarian','cataloguer')?[['staff','Staff desk','shield']]:[])];
const tb=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr>${r}</table></div>`;
const V={
welcome:()=>`<div class="wrap"><div class="row" style="flex-wrap:nowrap"><img src="${LOGO}" alt="Institute of Accountancy Arusha logo" style="height:64px;flex:0 0 auto;width:auto"><h1 style="margin:0">${anim('Institute of Accountancy Arusha')}</h1></div><div class="hero" style="margin-top:28px"><div><h2 style="font-size:1.8rem">${anim("We're taking you to the next level")}</h2><p class="mut">The IAA Library helps students, researchers and staff find books, borrow and return materials, and reach digital resources from any device.</p><p class="row"><button class="b" onclick="go('login')">Sign in</button><button class="b b2" onclick="go('register')">Register</button></p></div><img class="ph" src="${LIB}" alt="Institute of Accountancy Arusha library building"></div></div>`,
login:()=>`<div class="wrap" style="max-width:480px"><div class="card"><img src="${LOGO}" alt="IAA logo" style="height:52px"><h1 id="wl">Welcome Student/member to IAA Library</h1><p class="mut">Choose your role, then sign in.</p><div class="row chips" id="chips">${Object.entries(ROLES).map(([k,v])=>`<button class="b b2${k=='student'?' on':''}" data-r="${k}" onclick="pick('${k}')">${v}</button>`).join('')}</div><form onsubmit="event.preventDefault();login(this)"><label for="u">Username</label><input id="u" name="u" autocomplete="username" required><label for="p">Password</label><input id="p" name="p" type="password" autocomplete="current-password" required><p class="row"><button type="button" class="b b2" onclick="toast('Contact the library desk to reset your password')">Forgot password?</button><button class="b">Sign in</button></p></form><p class="row"><span>New to the library?</span><button class="b b2" onclick="go('register')">Register</button></p><p class="mut" style="font-size:.85rem">Demo accounts: admin, librarian, cataloguer, circulation, student, researcher. Password: iaa123</p></div></div>`,
register:()=>`<div class="wrap" style="max-width:480px"><div class="card"><img src="${LOGO}" alt="IAA logo" style="height:52px"><h1>Register for the IAA Library</h1><form onsubmit="event.preventDefault();reg(this)"><label>Full name<input name="n" required></label><label>Registration or staff number<input name="id" required></label><label>Email<input name="e" type="email" required></label><label>Username<input name="u" required autocomplete="username"></label><label>Password (at least 6 characters)<input name="p" type="password" minlength="6" required autocomplete="new-password"></label><label>I am a<select name="r"><option value="student">Student/member</option><option value="researcher">Researcher</option></select></label><p class="mut" style="font-size:.85rem">Staff roles are assigned by the library administrator.</p><p class="row"><button class="b">Create account</button><button type="button" class="b b2" onclick="go('login')">Back to sign in</button></p></form></div></div>`,
home:()=>`<div class="wrap"><h2>Welcome, ${D.users[D.cur].n}</h2><h1 style="font-size:2rem">${anim('Institute of Accountancy Arusha Library')}</h1><p style="font-size:1.2rem"><span class="cy" id="cy">Knowledge</span> &middot; Research &middot; Innovation</p><div class="hero"><div><h2>${anim("We're taking you to the next level")}</h2><p class="mut">Open hours: ${CFG.hours}</p><p class="row"><button class="b" onclick="go('opac')">Search books</button><button class="b b2" onclick="go('menu')">Open menu</button></p></div><img class="ph" src="${LIB}" alt="Institute of Accountancy Arusha library building"></div><h2 style="margin-top:28px">Quick links</h2><div class="g">${tiles().filter(t=>['opac','circulation','digital','research','account'].includes(t[0])||0).map(t=>`<button class="tile" onclick="go('${t[0]}')">${ic(t[2])}${t[1]}</button>`).join('')}<button class="tile" onclick="go('circulation')">${ic('book')}Borrow or return</button></div><h2 style="margin-top:28px">Featured books</h2><div class="g">${D.books.slice(0,3).map(bookCard).join('')}</div></div>`,
menu:()=>`<div class="wrap"><h1>Menu</h1><div class="g">${tiles().map(t=>`<button class="tile" onclick="go('${t[0]}')">${ic(t[2])}${t[1]}</button>`).join('')}</div></div>`,
about:()=>`<div class="wrap"><h1>About the library</h1><div class="hero"><div><p>The Institute of Accountancy Arusha Library is located at the Arusha Campus of the Institute of Accountancy Arusha, in Njiro, Arusha Region, Tanzania.</p><p>It supports teaching, learning and research through print and digital collections, trained library staff and quiet study space.</p><h3>Collections</h3><p>Books, newspapers, magazines, journals, reference materials, special collections and audio-visual materials.</p><h3>Opening hours</h3><p>${CFG.hours}</p></div><img class="ph" src="${LIB}" alt="Institute of Accountancy Arusha library building"></div></div>`,
opac:()=>`<div class="wrap"><h1>Online Public Access Catalogue</h1><div class="card"><div class="row"><input id="q" value="${Q.replace(/"/g,'')}" placeholder="Search books" aria-label="Search books" oninput="Q=this.value;res()"><select id="f" onchange="res()" aria-label="Search by"><option value="all">All fields</option><option value="t">Title</option><option value="a">Author</option><option value="i">ISBN</option><option value="s">Subject</option></select><input id="y" type="number" placeholder="Published from year" aria-label="Published from year" oninput="res()"></div><label><input type="checkbox" id="v" style="width:auto" onchange="res()"> Show only available books</label></div><p id="cnt" class="mut"></p><div class="g" id="res"></div></div>`,
digital:()=>`<div class="wrap"><h1>Digital library</h1><div class="g">${['E-books','E-journals','Research papers','Dissertations and theses','Past examination papers','Institutional repository','Digital archives'].map(x=>`<button class="tile" onclick="toast('${x} will open once the library links this collection')">${ic('book')}${x}</button>`).join('')}</div><p class="mut">Access respects copyright and institutional permissions.</p></div>`,
services:()=>`<div class="wrap"><h1>Services</h1><div class="g"><button class="tile" onclick="go('circulation')">${ic('book')}Circulation services<span class="mut">Borrow, return, renew, reserve</span></button>${[['Reading services','Reading rooms and study spaces for quiet individual and group work.'],['Reference service','Ask a librarian, literature searching, citation and referencing guidance.'],['Free Wi-Fi','Internet access in library areas for IAA students, researchers and staff.']].map(s=>`<div class="tile" style="cursor:default">${ic('list')}${s[0]}<span class="mut" style="font-weight:400">${s[1]}</span></div>`).join('')}</div></div>`,
circulation:()=>{const st=can('admin','librarian','circulation'),m=D.cur;return`<div class="wrap"><h1>Circulation</h1><div class="card">${st?'<label for="mu">Member username</label><input id="mu" placeholder="e.g. student">':''}<label for="bs">Book</label><select id="bs">${D.books.map(b=>`<option value="${b.id}">${b.t} (${av(b)} available)</option>`).join('')}</select><p class="row"><button class="b" onclick="cc('b')">Borrow</button><button class="b b2" onclick="cc('r')">Return</button><button class="b b2" onclick="cc('c')">Cancel reservation</button></p><p class="mut">Loan period 14 days. Maximum 5 books per member.</p></div>${loans(m)}</div>`},
research:()=>`<div class="wrap"><h1>Research support</h1><div class="g"><div class="card"><h3>Ask a librarian</h3><form onsubmit="event.preventDefault();msg('Ask a librarian',this.q.value);this.reset()"><textarea name="q" rows="3" required aria-label="Your question"></textarea><p><button class="b">Send question</button></p></form></div><div class="card"><h3>Citation and referencing</h3><p>Guidance on APA and other styles used at IAA.</p></div><div class="card"><h3>Literature searching</h3><p>Help to plan searches and find journal articles and theses.</p></div><div class="card"><h3>Information literacy training</h3><p>Workshops on finding, evaluating and using information.</p></div><div class="card"><h3>Research consultation</h3><form onsubmit="event.preventDefault();msg('Consultation request',this.q.value);this.reset()"><input name="q" placeholder="Preferred date and topic" required aria-label="Preferred date and topic"><p><button class="b">Request appointment</button></p></form></div></div></div>`,
facilities:()=>`<div class="wrap"><h1>Library facilities</h1><div class="g">${['Reading rooms','Computer laboratories','Discussion rooms','Study spaces','Internet access','Printing and photocopying','Room reservations'].map(x=>`<div class="card"><h3>${x}</h3></div>`).join('')}</div></div>`,
news:()=>`<div class="wrap"><h1>News and events</h1><div class="g">${[['Announcements','Library notices appear here.'],['New arrivals','Recently added accounting, ICT and library science titles.'],['Library orientation','For new students at the start of each academic year.'],['Information literacy programmes','Regular sessions on searching and referencing.'],['Research workshops','Skills for dissertations and projects.'],['Academic seminars and reading campaigns','Dates are shared through the library.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div>`,
account:()=>{const u=D.users[D.cur],m=D.cur,n=mine(m),od=n.filter(l=>l.d<Date.now()).length,rs=D.loans.filter(l=>l.u==m&&l.s=='res').length;return`<div class="wrap"><h1>My account</h1><div class="g"><div class="card"><h3>${u.n}</h3><p>Username: ${m}<br>Role: ${ROLES[u.role]}<br>Number: ${u.id||'Not set'}<br>Email: ${u.e||'Not set'}</p></div><div class="card"><h3>Notifications</h3><p>${od?od+' overdue book(s). Return them to avoid fines.':'No overdue books.'}<br>${rs} reservation(s) waiting.</p></div></div><div class="card" style="margin-top:14px"><h3>Update profile</h3><form onsubmit="event.preventDefault();u=D.users[D.cur];u.n=this.n.value;u.e=this.e.value;save();toast('Profile updated');render()"><div class="row"><input name="n" value="${u.n}" aria-label="Full name" required><input name="e" type="email" value="${u.e}" placeholder="Email" aria-label="Email"><button class="b">Save changes</button></div></form></div>${loans(m)}<p><button class="b b2" onclick="out()">Sign out</button></p></div>`},
contact:()=>`<div class="wrap"><h1>Contact us</h1><div class="g"><div class="card"><h3>Institute of Accountancy Arusha Library</h3><p>Arusha Campus, Njiro, Arusha Region, Tanzania<br>Email: ${CFG.email}<br>Phone: ${CFG.phone}<br>${CFG.hours}</p></div><div class="card"><h3>Feedback and complaints</h3><form onsubmit="event.preventDefault();msg('Feedback',this.q.value);this.reset()"><textarea name="q" rows="3" required aria-label="Your message"></textarea><p><button class="b">Send message</button></p></form></div></div><h2>Frequently asked questions</h2><div class="card"><p><b>How many books can I borrow?</b> Up to 5 at a time for 14 days.</p><p><b>How do I renew?</b> Open My account and select Renew.</p><p><b>Who can use the library?</b> Registered IAA students, researchers and staff.</p></div></div>`,
staff:()=>{const T=[...(can('admin','librarian','cataloguer')?[['add','Add book']]:[]),...(can('admin','librarian')?[['rep','Reports']]:[]),...(can('admin')?[['usr','Users']]:[])];tab=tab||T[0][0];let c='';
if(tab=='add')c=`<form class="card" onsubmit="event.preventDefault();addBook(this)"><div class="row"><input name="t" placeholder="Title" required><input name="a" placeholder="Author" required><input name="y" type="number" placeholder="Year" required><input name="i" placeholder="ISBN"><input name="s" placeholder="Subject" required><input name="k" placeholder="Class number" required><input name="l" placeholder="Shelf" required><input name="c" type="number" min="1" value="1" aria-label="Copies"></div><p><button class="b">Add to catalogue</button></p></form>`;
if(tab=='rep'){const cnt={};D.loans.forEach(l=>cnt[l.b]=(cnt[l.b]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0],td=new Date().toISOString().slice(0,10),mo=td.slice(0,7);const S=[['Registered members',Object.values(D.users).filter(u=>['student','researcher'].includes(u.role)).length],['Book titles',D.books.length],['Copies on shelf',D.books.reduce((s,b)=>s+av(b),0)],['Borrowed now',D.loans.filter(l=>l.s=='out').length],['Overdue',D.loans.filter(l=>l.s=='out'&&l.d<Date.now()).length],['Visits today',D.visits[td]||0],['Visits this month',Object.entries(D.visits).filter(e=>e[0].startsWith(mo)).reduce((s,e)=>s+e[1],0)],['Feedback received',D.msgs.length]];c=`<div class="g">${S.map(s=>`<div class="card"><div class="stat">${s[1]}</div>${s[0]}</div>`).join('')}</div><p>Most borrowed: ${top?bk(top[0]).t+' ('+top[1]+' loans)':'No loans yet'}</p>${D.msgs.length?'<h3>Messages</h3>'+tb(['Type','Message','From'],D.msgs.map(m=>`<tr><td>${m.k}</td><td>${m.m}</td><td>${m.u}</td></tr>`).join('')):''}`}
if(tab=='usr')c=tb(['Username','Name','Role'],Object.entries(D.users).map(([k,u])=>`<tr><td>${k}</td><td>${u.n}</td><td><select aria-label="Role of ${k}" onchange="D.users['${k}'].role=this.value;save();toast('Role updated')">${Object.entries(ROLES).map(([r,n])=>`<option value="${r}"${u.role==r?' selected':''}>${n}</option>`).join('')}</select></td></tr>`).join(''));
return`<div class="wrap"><h1>Staff desk</h1><div class="row chips">${T.map(t=>`<button class="b b2${tab==t[0]?' on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div><div style="margin-top:14px">${c}</div></div>`}};
function loans(m){const n=mine(m),r=D.loans.filter(l=>l.u==m&&l.s=='res');return`<h2 style="margin-top:24px">Books borrowed (${n.length} of 5)</h2>${n.length?tb(['Book','Due date','Status',''],n.map(l=>`<tr><td>${bk(l.b).t}</td><td>${fd(l.d)}</td><td>${l.d<Date.now()?'<span class="badge no">Overdue</span>':'<span class="badge">On time</span>'}</td><td><button class="b s b2" onclick="circ('n','${m}',${l.b})">Renew</button></td></tr>`).join('')):'<p class="mut">No books borrowed. Search the catalogue to find one.</p>'}${r.length?'<p class="mut">Reserved: '+r.map(l=>bk(l.b).t).join(', ')+'</p>':''}`}
function cc(a){const m=$('#mu');circ(a,m?m.value.trim():D.cur,$('#bs').value)}
function msg(k,m){D.msgs.push({k,m,u:D.cur,t:Date.now()});save();toast('Sent. The library will respond to you.')}
function addBook(f){const v=Object.fromEntries(new FormData(f));D.books.push({id:Math.max(...D.books.map(b=>b.id))+1,t:v.t,a:v.a,y:+v.y,i:v.i||'Not set',s:v.s,k:v.k,l:v.l,c:+v.c});save();f.reset();toast('Book added to the catalogue')}
function res(){const q=($('#q').value||'').toLowerCase(),f=$('#f').value,y=+$('#y').value||0,v=$('#v').checked;const r=D.books.filter(b=>(!q||(f=='all'?[b.t,b.a,b.i,b.s,b.k]:[b[f]]).join(' ').toLowerCase().includes(q))&&b.y>=y&&(!v||av(b)>0));H($('#cnt'),r.length+' result'+(r.length==1?'':'s'));H($('#res'),r.length?r.map(bookCard).join(''):'<p>No books match. Try fewer words or a different field.</p>')}
function pick(k){window.R=k;document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.r==k));$('#wl').textContent='Welcome '+ROLES[k]+' to IAA Library'}
function login(f){const u=f.u.value.trim().toLowerCase(),a=D.users[u],r=window.R||'student';if(!a||a.p!=f.p.value)return toast('Username or password is incorrect');if(a.role!=r)return toast('This account is registered as '+ROLES[a.role]+'. Select that role to sign in.');D.cur=u;const d=new Date().toISOString().slice(0,10);D.visits[d]=(D.visits[d]||0)+1;save();go('home')}
function reg(f){const u=f.u.value.trim().toLowerCase();if(D.users[u])return toast('That username is taken. Choose another');D.users[u]={n:f.n.value,p:f.p.value,role:f.r.value,id:f.id.value,e:f.e.value};save();toast('Account created. Sign in to continue');go('login')}
function render(){theme();window.R='student';const v=location.hash.slice(1)||'welcome',pub=['welcome','login','register'];let x=V[v]?v:'welcome';if(!D.cur&&!pub.includes(x))x='login';if(D.cur&&pub.includes(x)&&x!='welcome')x='home';hdr();H($('#app'),V[x]());if(x=='opac')res();if(x=='staff'&&0)0;scrollTo(0,0);clearInterval(cyT);const c=$('#cy');if(c){const w=['Knowledge','Research','Innovation'];let i=0;cyT=setInterval(()=>{const e=$('#cy');if(!e)return clearInterval(cyT);e.style.opacity=0;setTimeout(()=>{i=(i+1)%3;e.textContent=w[i];e.style.opacity=1},400)},2500)}}
addEventListener('hashchange',render);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(D.set.theme=='auto'){theme();hdr()}});render();
</script></body></html>
